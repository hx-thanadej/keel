# keel-controls@2: the Controls Keel is measured against, per framework, and
# the Keel Policies (each at one Enforcement Point) that evidence them. One
# Policy covers many Controls across frameworks. A Control no Policy evidences
# has `covered_by: []` and a `gap_reason`, so the report shows the gap.
# Versioned data: change by pull request, bump the version when the shape
# changes. Titles only; never copy a framework's requirement text.
version: keel-controls@2
frameworks:
  - {id: SSDF, name: "NIST SSDF 1.2 (SP 800-218r1)"}
  - {id: SLSA, name: "SLSA v1.2 build track"}
  - {id: CRA, name: "EU Cyber Resilience Act, Annex I"}
  - {id: OWASP-CICD, name: "OWASP Top 10 CI/CD Security Risks"}
  - {id: ISO27001, name: "ISO/IEC 27001:2022 Annex A"}
  - {id: SOC2, name: "AICPA Trust Services Criteria (2017, revised points of focus 2022)"}
policies:
  - {name: keel-authz@1, point: api, description: "Every API call decided by OPA; default deny; Tenant isolation"}
  - {name: keel-access@1, point: cloud, description: "Just-in-time Access Grants: role eligibility per Team and Environment, time-boxed; write or production grants need approval by a Team Lead (plus a second approver for production write) who is not the requester; read-only non-production grants are self-served"}
  - {name: keel-github@1, point: pr, description: "Rulesets (review, CODEOWNERS, checks), secret scanning + push protection, Actions SHA pinning, read-only token"}
  - {name: keel-scans@1, point: pipeline, description: "SARIF from secrets/SAST/SCA/IaC scanners → owned Findings"}
  - {name: keel-release@1, point: pipeline, description: "Sigstore-verified SLSA provenance from Keel's builder; VSA per image"}
  - {name: keel-sbom@1, point: pipeline, description: "SBOM per Release; CISA 2026 minimum elements; daily OSV re-match"}
  - {name: keel-promotion@1, point: promotion, description: "Digests only, previous Environment first, VSA, no unexcepted critical Findings, budget, approval by someone other than the requester"}
  - {name: keel-admission@1, point: admission, description: "Kyverno IVP signature + provenance; digest-only VAP"}
  - {name: keel-baseline@1, point: cloud, description: "Organisation SCPs: stay in org, protect CloudAudit, identities only via Keel"}
  - {name: keel-ci-identity@1, point: cloud, description: "Keyless CI: OIDC role pinned to repository id + environment, no access keys"}
  - {name: keel-findings@1, point: platform, description: "Owner, severity and SLA on every Finding; Exceptions time-boxed and approved by someone other than the requester"}
  - {name: keel-vex@1, point: platform, description: "VEX statements with justification applied at gates"}
  - {name: keel-activity@1, point: platform, description: "Signed, chained, archived Activity Log"}
controls:
  # NIST SSDF 1.2 (SP 800-218r1)
  - {framework: SSDF, id: "PO.1.1", title: "Identify and document security requirements for software development", covered_by: [], gap_reason: "Security requirements are written by each Team; no Policy checks them"}
  - {framework: SSDF, id: "PO.3.2", title: "Follow recommended security practices to deploy, operate and maintain toolchains", covered_by: [keel-github@1, keel-ci-identity@1]}
  - {framework: SSDF, id: "PO.5.1", title: "Separate and protect each environment involved in software development", covered_by: [keel-baseline@1, keel-ci-identity@1]}
  - {framework: SSDF, id: "PS.1.1", title: "Store all forms of code based on least privilege and protect from tampering", covered_by: [keel-github@1]}
  - {framework: SSDF, id: "PS.2.1", title: "Make software integrity verification information available", covered_by: [keel-release@1]}
  - {framework: SSDF, id: "PS.3.2", title: "Collect, safeguard, maintain and share provenance data (SBOM)", covered_by: [keel-sbom@1, keel-release@1]}
  - {framework: SSDF, id: "PW.4.4", title: "Verify that acquired components comply with requirements throughout their life", covered_by: [keel-sbom@1, keel-scans@1]}
  - {framework: SSDF, id: "PW.7.2", title: "Review and analyse code for vulnerabilities (automated)", covered_by: [keel-scans@1]}
  - {framework: SSDF, id: "PW.9.1", title: "Secure the build and deployment configuration by default", covered_by: [keel-admission@1, keel-promotion@1]}
  - {framework: SSDF, id: "RV.1.1", title: "Gather information about potential vulnerabilities in released software", covered_by: [keel-sbom@1, keel-scans@1]}
  - {framework: SSDF, id: "RV.2.2", title: "Plan and implement risk responses for vulnerabilities", covered_by: [keel-findings@1, keel-vex@1]}
  # SLSA v1.2 build track
  - {framework: SLSA, id: "SLSA-BUILD-L1", title: "Provenance exists", covered_by: [keel-release@1]}
  - {framework: SLSA, id: "SLSA-BUILD-L2", title: "Hosted build platform, signed provenance", covered_by: [keel-release@1]}
  - {framework: SLSA, id: "SLSA-BUILD-L3", title: "Hardened build: isolated, provenance unforgeable by tenants", covered_by: [keel-release@1, keel-admission@1]}
  # EU Cyber Resilience Act, Annex I
  - {framework: CRA, id: "CRA-I.1.2c", title: "Vulnerabilities addressed by security updates", covered_by: [keel-findings@1, keel-promotion@1]}
  - {framework: CRA, id: "CRA-I.1.2f", title: "Protection of integrity of data, programs and configuration", covered_by: [keel-release@1, keel-admission@1, keel-activity@1]}
  - {framework: CRA, id: "CRA-I.2.1", title: "Identify and document components, including an SBOM", covered_by: [keel-sbom@1]}
  - {framework: CRA, id: "CRA-I.2.2", title: "Address and remediate vulnerabilities without delay", covered_by: [keel-findings@1, keel-sbom@1]}
  - {framework: CRA, id: "CRA-I.2.4", title: "Publicly disclose fixed vulnerabilities (VEX/advisories)", covered_by: [keel-vex@1]}
  # OWASP Top 10 CI/CD Security Risks
  - {framework: OWASP-CICD, id: "CICD-SEC-1", title: "Insufficient flow control mechanisms", covered_by: [keel-github@1, keel-promotion@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-2", title: "Inadequate identity and access management", covered_by: [keel-authz@1, keel-ci-identity@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-3", title: "Dependency chain abuse", covered_by: [keel-sbom@1, keel-scans@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-4", title: "Poisoned pipeline execution", covered_by: [keel-github@1, keel-release@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-6", title: "Insufficient credential hygiene", covered_by: [keel-ci-identity@1, keel-github@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-7", title: "Insecure system configuration (CI/CD systems themselves)", covered_by: [], gap_reason: "No Policy checks the hardening of CI runners and build systems"}
  - {framework: OWASP-CICD, id: "CICD-SEC-9", title: "Improper artifact integrity validation", covered_by: [keel-release@1, keel-admission@1]}
  - {framework: OWASP-CICD, id: "CICD-SEC-10", title: "Insufficient logging and visibility", covered_by: [keel-activity@1]}

