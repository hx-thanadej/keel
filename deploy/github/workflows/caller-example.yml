# What a Service's .github/workflows/keel.yml looks like (written by Service
# Templates, #92). The reusable workflow is pinned by commit SHA.
name: keel
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions: {}
jobs:
  keel:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: acme/keel-workflows/.github/workflows/keel-build.yml@0000000000000000000000000000000000000000 # pin to a reviewed SHA
    with:
      keel-url: https://keel.example.com
      tenant: 00000000-0000-0000-0000-000000000000
      service: 00000000-0000-0000-0000-000000000000
      image: crm-api
